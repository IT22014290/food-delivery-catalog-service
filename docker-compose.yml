version: "3.9"

services:
  catalog-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./catalog.db
      - AUTH_SERVICE_URL=http://auth-service:8001
      - AUTH_REQUIRED=false   # Set to true when Auth Service is running
      - DEBUG=true
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes:
      - ./src:/app/src        # Live reload in dev
    depends_on:
      - auth-service-mock

  # Mock Auth Service for local dev (replace with real service in production)
  auth-service-mock:
    image: mockserver/mockserver:latest
    ports:
      - "8001:8001"
    environment:
      - MOCKSERVER_SERVER_PORT=8001
